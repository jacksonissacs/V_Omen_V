<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OMEN — this path is not hosted here</title>
    <meta
      name="description"
      content="GitHub Pages is not the OMEN application. /pulse and other app routes are not hosted here."
    />
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0 auto;
        max-width: 40rem;
        padding: 2.5rem 1.25rem;
        font-family: ui-sans-serif, system-ui, sans-serif;
        line-height: 1.5;
        background: #111;
        color: #ececec;
      }
      h1 {
        font-size: 1.6rem;
        line-height: 1.25;
        font-weight: 600;
      }
      .notice {
        border: 1px solid #5a5a5a;
        padding: 1rem 1.1rem;
        margin: 1.25rem 0;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.92em;
      }
      a {
        color: #d4d4d4;
      }
    </style>
  </head>
  <body>
    <p>OMEN · GitHub Pages</p>
    <h1>This path is not the OMEN application</h1>
    <div class="notice">
      <p>
        GitHub Pages does not host the runnable Next.js product.
        <code>/pulse</code>, <code>/events</code>, and other application routes

      </p>
    </div>
    <p>
      <a href="./">Why this site is documentation only</a>
      ·
      <a href="https://github.com/jacksonissacs/V_Omen_V#local-demo"
